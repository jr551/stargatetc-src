// Sound tour for the weapon sounds added in the weapon effects pass.
//
// Start a single-player game on sg_nox, copy this file to stargatetc/sound_tour.cfg, and run
// `exec sound_tour` from the console. It restarts sg_nox, then goes through each weapon in turn:
// a STEP line in the console names the sound to listen for, and the action follows a few
// seconds later. The whole tour takes about two minutes. It needs sv_cheats and sgtc_test_enable,
// which it sets itself, and it turns on god mode so a stray blast does not end it.
//
// The waits are aliases because a long run of plain `wait` lines overflows the command buffer.
sv_cheats 1
sgtc_test_enable 1
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w3 "wait;wait;wait"
alias w30 "w10;w10;w10"
alias w40 "w10;w10;w10;w10"
map sg_nox
w100;w100;w100
god

echo "STEP 1/14: MP5 secondary: a dry-fire click"
sgtc_test stamina_100
give weapon_mp5
w10
use weapon_mp5
w100;w100
sgtc_test ammo_5
sgtc_test stamina_100
w100
+attack2
w10
-attack2
w100

echo "STEP 2/14: M16 scope toggle: a click on, a click off"
sgtc_test stamina_100
