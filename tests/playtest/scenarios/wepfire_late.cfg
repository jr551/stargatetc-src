maxplayers 8
sgtc_bot_quota 2
sgtc_test_enable 1
// The sweep needs a live bot that is not an observer, and the bots are not always out of the
// round start at the same time, so it is called every 4 s from 45 s (the knife's deploy pad is
// an absolute 40.07 s). A call with no shooter does nothing, a call after the sweep ran the
// retry pass once, and a bot that killed itself with its own weapon is continued next round.
sgtc_test_timed_script "info;players"
sgtc_test_timed_delay 45
sgtc_test_repeat_script "wepfireall"
sgtc_test_repeat_delay 45
sgtc_test_repeat_interval 4
sgtc_test_repeat_count 12
sgtc_test_timed2_script "info;players"
sgtc_test_timed2_delay 92
sgtc_test_timed3_script "info;quit"
sgtc_test_timed3_delay 95
